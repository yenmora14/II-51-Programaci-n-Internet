<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAB-03</title>
  <link rel="stylesheet" href="estilos.css" />
</head>

<body>

  <header>
    <h1 id="main-title" class="title">Plataforma Educativa Universidad Central</h1>
    <h2 class="title">Universidad Central</h2>
  </header>

  <nav class="nav-menu">
    <ul class="nav-list">
      <li class="menu-item"><a href="index.html">Inicio</a></li>
      <li class="menu-item"><a href="cursos.html">Cursos</a></li>
      <li class="menu-item"><a href="contacto.html">Contacto</a></li>
      <li class="menu-item"><a href="ayuda.html">Ayuda</a></li>
    </ul>
  </nav>

  <main>
    <section>
      <form action="#" method="post">
        <fieldset>
          <legend>Registro de Usuario</legend>

          <div class="form-group">
            <label for="username">Nombre de Usuario:</label>
            <input class="form-input" type="text" id="username" name="username" required>

            <label for="email">Correo Electrónico:</label>
            <input class="form-input" type="email" id="email" name="email" required>

            <label for="password">Contraseña:</label>
            <input class="form-input" type="password" id="password" name="password" required>
          </div>

          <fieldset>
            <legend>Género</legend>

            <label><input type="radio" value="m" name="genero"> Masculino</label>
            <label><input type="radio" value="f" name="genero"> Femenino</label>
            <label><input type="radio" value="o" name="genero"> Otro</label>
            <label><input type="radio" value="n" name="genero"> Prefiero no decirlo</label>

          </fieldset>

          <fieldset>
            <legend>Seleccione sus intereses:</legend>

            <label><input type="checkbox" name="intereses" value="programacion"> Programación</label>
            <label><input type="checkbox" name="intereses" value="diseño"> Diseño Gráfico</label>
            <label><input type="checkbox" name="intereses" value="marketing"> Marketing Digital</label>
            <label><input type="checkbox" name="intereses" value="ciencia"> Ciencia de Datos</label>

          </fieldset>

          <button class="submit-button" type="submit">Registrar</button>

        </fieldset>
      </form>
    </section>

    <section>
      <iframe width="560" height="315"
        src="https://www.youtube.com/embed/LXb3EKWsInQ?start=61"
        title="Video Incrustado"
        frameborder="0"
        allowfullscreen></iframe>
    </section>
  </main>

  <footer>
    <p>&copy; 2023 Plataforma Educativa Universidad Central</p>
    <p>Contacto: <a href="mailto:fabian.chinchilla@uc.ac.cr">fabian.chinchilla@uc.ac.cr</a></p>
  </footer>

</body>
</html>
