<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lab05 - Bootstrap 5</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS propio -->
    <link rel="stylesheet" href="index.css">
</head>
<body>

<div class="container-fluid mt-3">

    <!-- Encabezado -->
    <div class="p-3 bg-light border rounded">
        <h1 class="display-5">Lab05</h1>
        <p class="text-success">container-fluid</p>
        <p>One of three columns</p>
    </div>

    <!-- Grid Responsive -->
    <div class="row text-center mt-4 pintar">
        <div class="col-sm-8 border p-3">Responsive</div>
        <div class="col-sm-4 border p-3">col-sm-4</div>
    </div>

    <div class="row text-center">
        <div class="col-sm-4 border p-3">col-sm-4</div>
        <div class="col-sm-2 border p-3">col-sm-2</div>
        <div class="col-sm-6 border p-3">col-sm-6</div>
    </div>

    <div class="row text-center">
        <div class="col-sm border p-3">col-sm</div>
        <div class="col-sm border p-3">col-sm</div>
    </div>

    <!-- Formulario -->
    <form class="mt-4">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Nombre</label>
                <input type="text" id="nombre" class="form-control">
            </div>

            <div class="col-md-6">
                <label class="form-label">Email</label>
                <input type="email" id="email" class="form-control">
            </div>
        </div>

        <button type="button" class="btn btn-success mt-3" onclick="mostrarDatos()">Enviar</button>
    </form>

</div>

<!-- JS SIEMPRE AQUÍ ABAJO -->
<script src="main.js"></script>

</body>
</html>
