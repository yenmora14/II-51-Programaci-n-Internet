<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contacto | Gestión Deportiva</title>
  <link rel="stylesheet" href="estilos.css" />
</head>

<body>
  <header>
    <h1 id="main-title" class="title">Contacto</h1>
    <h2 class="title">Soporte y consultas</h2>
  </header>

  <nav class="nav-menu">
    <ul class="nav-list">
      <li class="menu-item"><a href="index.html">Inicio</a></li>
      <li class="menu-item"><a href="cursos.html">Planes</a></li>
      <li class="menu-item"><a href="contacto.html">Contacto</a></li>
      <li class="menu-item"><a href="ayuda.html">Ayuda</a></li>
    </ul>
  </nav>

  <main>
    <section>
      <form action="#" method="post">
        <fieldset>
          <legend>Formulario de Contacto</legend>

          <div class="form-group">
            <label for="nombre">Nombre:</label>
            <input class="form-input" type="text" id="nombre" name="nombre" required />

            <label for="correo">Correo:</label>
            <input class="form-input" type="email" id="correo" name="correo" required />

            <label for="mensaje">Mensaje:</label>
            <textarea class="form-input" id="mensaje" name="mensaje" rows="5" required></textarea>
          </div>

          <button class="submit-button" type="submit">Enviar</button>
        </fieldset>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Gestión Deportiva</p>
  </footer>
</body>
</html>
